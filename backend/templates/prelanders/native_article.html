<style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#111;color:#fff}.bg{min-height:100vh;background:linear-gradient(rgba(0,0,0,.58),rgba(0,0,0,.72)),url('{{.VisualPath}}') center/cover;display:flex;align-items:center;justify-content:center;padding:22px}.card{width:min(390px,100%);background:rgba(15,23,42,.82);border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.45);backdrop-filter:blur(10px)}h1{font-size:30px;line-height:1.05;margin:0 0 12px}p{color:#dbeafe;line-height:1.55}.btn,.cta{display:block;width:100%;border:0;border-radius:16px;padding:15px 16px;margin:10px 0;background:#22c55e;color:#06230f;font-weight:800;text-align:center;text-decoration:none;font-size:16px}.alt{background:rgba(255,255,255,.12);color:#fff}.disc{font-size:11px;color:#cbd5e1;margin-top:18px}.hero{width:100%;border-radius:20px;margin:14px 0;max-height:250px;object-fit:cover}.pill{display:inline-block;background:#f97316;color:#fff;border-radius:999px;padding:8px 12px;font-weight:700}.result{background:rgba(34,197,94,.16);border:1px solid rgba(34,197,94,.5);border-radius:18px;padding:14px;margin:14px 0}</style>
<div class="bg"><article class="card"><h1>{{.Content.Headline}}</h1><img class="hero" src="{{.VisualPath}}" alt="creative"><p>{{.Content.Subheadline}}</p><p>{{.Content.Body}}</p><p>{{.Content.ResultText}}</p><a class="cta" href="{{.OfferURL}}">{{.Content.CTA}}</a><div class="disc">{{.Content.Disclaimer}}</div></article></div>
