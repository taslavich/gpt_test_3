syntax = "proto3";

package events;

option go_package = "gitlab.com/twinbid-exchange/RTB-exchange/internal/grpc/proto/buffer;eventspb";

message BidResponses {
  map<string, string> items = 1;
}

message OrtbEvent {
  string uuid = 1;
  int64 event_time_ms = 2;

  string typic = 3;
  string format = 4;
  string spp_domain = 5;
  string geo = 6;

  uint32 city_id = 7;

  map<string, string> bid_responses = 8;

  string ip = 9;
  string ipv6 = 10;
  string lang = 11;
  string browser = 12;
  string browser_version = 13;
  string os = 14;
  string os_version = 15;
  string device = 16;
  string site_id = 17;
  string site_domain = 18;

  double bid_floor = 19;

  string win_dsp_domain = 20;

  double win_price = 21;
  double win_dsp_price = 22;

  string win_cid = 23;
  string win_crid = 24;
  string win_user_id = 25;

  uint32 code = 26;
}

message ImpressionEvent {
  string impressions_uuid = 1;
  string ortb_uuid = 2;
  int64 event_time_impressions_ms = 3;
  string format = 4;
}

message ClickEvent {
  string clicks_uuid = 1;
  string ortb_uuid = 2;
  int64 event_time_clicks_ms = 3;
  string format = 4;
}

message ConversionEvent {
  string conversions_uuid = 1;
  string clicks_uuid = 2;
  string payout = 3;
  string status = 4;
  int64 conversion_event_time_ms = 5;
}
