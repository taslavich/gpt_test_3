syntax = "proto3";
package orchestrator;
option go_package = "gitlab.com/twinbid-exchange/RTB-exchange/internal/grpc/proto/services/orchestrator;orchestratorGrpc";

import "types/ortb_V2_5/ortb.proto";

service OrchestratorService {
  rpc getWinnerBid_V2_5(OrchestratorRequest_V2_5) returns (OrchestratorResponse_V2_5) {}
}

message OrchestratorRequest_V2_5 {
  ortb_V2_5.BidRequest bidRequest = 1;
  map<string, string> impIdUuid = 2;
  string ssp_domain = 3;
  bool logged = 4;
  string typic = 5;
  string format = 6;
  string sspUrl = 7;
  string traffic_type = 8;
  string feed = 9;
}

message OrchestratorResponse_V2_5 {
  ortb_V2_5.BidResponse bidResponse = 1;
  string globalId = 2;
  int32 code = 3;
  repeated string failedImpIds = 4;
  map<string, string> impIdUuidClone = 5;
  bool rekl = 6;
  map<string, string> winnerUserIds = 7;
}
