user root;
worker_processes auto;
pid /run/nginx.pid;

error_log /var/log/rtb/nginx.error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format timing '[$time_local] "$request" '
                     'connect_time=$upstream_connect_time '
                     'header_time=$upstream_header_time '
                     'response_time=$upstream_response_time '
                     'total_time=$request_time';

    access_log /var/log/rtb/nginx.log timing;
    error_log  /var/log/rtb/nginx.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # [GLOBAL CAP=1000 r/s] ключ-«ведро» для глобального лимита (одна общая корзина)
    map $request_uri $global_cap_key { default 1; }

    # [GLOBAL CAP=1000 r/s] код ответа при превышении
    limit_req_status 429;

    # [GLOBAL CAP=1000 r/s] зона «всего по серверу» (учитывается и на 80, и на 443)
    limit_req_zone $global_cap_key zone=req_global_all:10m rate=1000r/s;

    # [PORT 80 CAP=1000 r/s] отдельная зона для лимита именно на порт 80
    limit_req_zone $global_cap_key zone=req_port_80:10m rate=1000r/s;

    # [PORT 443 CAP=1000 r/s] отдельная зона для лимита именно на порт 443
    limit_req_zone $global_cap_key zone=req_port_443:10m rate=1000r/s;

    # локальный статус (по желанию)
    server {
        listen 127.0.0.1:8089;
        server_name _;
        access_log off;

        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
    }

    server {
        listen 80;
        server_name twinbidexchange.com www.twinbidexchange.com;

        access_log /var/log/rtb/access_80.log timing;
        error_log  /var/log/rtb/nginx.error.log warn;

        # [GLOBAL CAP=1000 r/s] применяем глобальную крышку тут
        limit_req zone=req_global_all;

        # [PORT 80 CAP=1000 r/s] применяем лимит на порт 80
        limit_req zone=req_port_80;

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name twinbidexchange.com www.twinbidexchange.com;

        ssl_certificate     /etc/ssl/fullchain.pem;
        ssl_certificate_key /etc/ssl/privkey.pem;

        access_log /var/log/rtb/access_443.log timing;
        error_log  /var/log/rtb/nginx.error.log warn;

        # [GLOBAL CAP=1000 r/s] применяем глобальную крышку тут
        limit_req zone=req_global_all;

        # [PORT 443 CAP=1000 r/s] применяем лимит на порт 443
        limit_req zone=req_port_443;

        location /bidRequest/ {
            rewrite ^/bidRequest/(.*) /$1 break;
            proxy_pass http://127.0.0.1:8086;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 1s;
            proxy_send_timeout    5s;
            proxy_read_timeout    5s;
        }
    }
}
