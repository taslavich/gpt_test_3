user root;
worker_processes auto;
pid /run/nginx.pid;

error_log /var/log/rtb/nginx.error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;  # УВЕЛИЧЕНО для нагрузочного тестирования

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format timing '[$time_local] "$request" '
                     'connect_time=$upstream_connect_time '
                     'header_time=$upstream_header_time '
                     'response_time=$upstream_response_time '
                     'total_time=$request_time';

    access_log /var/log/rtb/nginx.log timing;
    error_log  /var/log/rtb/nginx.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # УБРАНЫ ВСЕ LIMIT_REQ ДИРЕКТИВЫ

    server {
        listen 127.0.0.1:8089;
        server_name _;
        access_log off;

        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
    }

    server {
        listen 80;
        server_name twinbidexchange.com www.twinbidexchange.com;

        access_log /var/log/rtb/access_80.log timing;
        error_log  /var/log/rtb/nginx.error.log warn;

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name twinbidexchange.com www.twinbidexchange.com;

        ssl_certificate     /etc/ssl/fullchain.pem;
        ssl_certificate_key /etc/ssl/privkey.pem;

        access_log /var/log/rtb/access_443.log timing;
        error_log  /var/log/rtb/nginx.error.log warn;

        location /bidRequest/ {
            rewrite ^/bidRequest/(.*) /$1 break;
            proxy_pass http://127.0.0.1:8086;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 1s;
            proxy_send_timeout    1s;
            proxy_read_timeout    1s;
            proxy_buffering off;
        }
    }
}